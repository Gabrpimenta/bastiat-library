appId: com.gabrielpimenta.bastiatlibrary
---
- openLink: bastiat://lesson/the-broken-window
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Play lesson
    timeout: 20000
- tapOn: Play lesson
- extendedWaitUntil:
    visible: Pause lesson
    timeout: 20000
- tapOn: Forward 15 seconds
- tapOn: Pause lesson
- scrollUntilVisible:
    element:
      text: 'Download ·.*'
    direction: DOWN
- tapOn: 'Download ·.*'
- extendedWaitUntil:
    visible: Downloaded
    timeout: 30000
- takeScreenshot: ios-downloaded
- tapOn: Downloaded
- assertVisible: 'Available offline.*'
- takeScreenshot: ios-library
