appId: com.gabrielpimenta.bastiatlibrary
---
- launchApp
- openLink: bastiat://lesson/thinking-in-alternatives
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Play lesson
    timeout: 20000
- scrollUntilVisible:
    element: Play lesson
    direction: DOWN
- tapOn: Play lesson
- extendedWaitUntil:
    visible: Pause lesson
    timeout: 20000
- tapOn: Forward 15 seconds
- tapOn: Pause lesson
- takeScreenshot: native-video-paused
- openLink: bastiat://lesson/the-broken-window
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element: Play lesson
    direction: DOWN
- tapOn: Play lesson
- extendedWaitUntil:
    visible: Pause lesson
    timeout: 20000
- tapOn: Pause lesson
- takeScreenshot: native-audio-paused
