name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: bastiat_ci
          POSTGRES_USER: bastiat_ci
          POSTGRES_PASSWORD: ephemeral-ci-database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bastiat_ci -d bastiat_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bastiat_ci:ephemeral-ci-database@127.0.0.1:5432/bastiat_ci
      PAYLOAD_DB_PUSH: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_SERVER_COMMAND: pnpm --filter @bastiat/web start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm check
      - name: Apply schema to the disposable database
        working-directory: apps/web
        run: NODE_ENV=production node --env-file=.env.local node_modules/payload/bin.js migrate
      - run: pnpm seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the API and exercise authorization and replay
        run: |
          pnpm --filter @bastiat/web start > .local/ci-server.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          pnpm test:api
          CI_SERVER_ALREADY_RUNNING=true pnpm test:e2e
      - name: Verify a production native JS bundle
        run: pnpm --filter @bastiat/mobile exec expo export --platform ios --output-dir ../../.local/ios-export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: validation-failure-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
