services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: bastiat
      POSTGRES_USER: bastiat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the database}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bastiat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bastiat -d bastiat']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bastiat-postgres:
